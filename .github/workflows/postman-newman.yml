name: EcoVolt Billing — Postman / Newman API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-tests:
    name: Run API Tests (Newman)
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java 25 ───────────────────────────────────────────────────────────
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # ── Build the service ─────────────────────────────────────────────────
      - name: Build billing-service (skip tests)
        working-directory: billing-service
        run: ./gradlew bootJar --no-daemon -x test

      # ── Start billing-service in background ───────────────────────────────
      - name: Start billing-service
        working-directory: billing-service
        run: |
          JAR=$(find build/libs -name "*.jar" ! -name "*plain*" | head -1)
          echo "Starting JAR: ${JAR}"
          java -jar "${JAR}" &
          echo "BILLING_PID=$!" >> "${GITHUB_ENV}"

      # ── Wait for /actuator/health ─────────────────────────────────────────
      - name: Wait for service health
        run: |
          echo "Polling /actuator/health..."
          ATTEMPTS=0
          MAX=30
          until curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; do
            ATTEMPTS=$((ATTEMPTS + 1))
            if [ "${ATTEMPTS}" -ge "${MAX}" ]; then
              echo "ERROR: Service did not become healthy after ${MAX} attempts (60s)." >&2
              exit 1
            fi
            echo "  attempt ${ATTEMPTS}/${MAX} — waiting 2s..."
            sleep 2
          done
          echo "Service is UP."

      # ── Node.js + Newman ──────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and reporters
        run: npm install -g newman newman-reporter-htmlextra

      # ── Run Newman ────────────────────────────────────────────────────────
      - name: Run Postman collection (Newman)
        run: |
          chmod +x postman/scripts/run-newman.sh
          ./postman/scripts/run-newman.sh ci http://localhost:8080

      # ── Upload reports ────────────────────────────────────────────────────
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: newman-reports/*.html
          if-no-files-found: warn

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-junit-report
          path: newman-reports/*.xml
          if-no-files-found: warn

      # ── Publish test results ──────────────────────────────────────────────
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Newman API Tests
          path: newman-reports/*.xml
          reporter: java-junit
          fail-on-error: true
